services:
  postgres:
    image: postgres:16-alpine
    container_name: ux-eval-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uxeval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uxeval}
      POSTGRES_DB: ${POSTGRES_DB:-uxeval}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uxeval} -d ${POSTGRES_DB:-uxeval}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ux-eval-network

  redis:
    image: redis:7-alpine
    container_name: ux-eval-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ux-eval-network

volumes:
  postgres_data:
  redis_data:

networks:
  ux-eval-network:
    driver: bridge
    name: ux-eval-network
