services:
  postgres:
    image: postgres:16-alpine
    container_name: ux-eval-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uxeval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uxeval}
      POSTGRES_DB: ${POSTGRES_DB:-uxeval}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uxeval} -d ${POSTGRES_DB:-uxeval}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ux-eval-network

  redis:
    image: redis:7-alpine
    container_name: ux-eval-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ux-eval-network

  # S3-compatible object store for UX audit artifacts (full-page screenshots).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ux-eval-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ux-eval-network

  # One-shot: create the artifacts bucket so the worker never has to bootstrap it.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: ux-eval-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ux-artifacts}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        echo "[minio-init] bucket ready: $$MINIO_BUCKET"
    networks:
      - ux-eval-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  ux-eval-network:
    driver: bridge
    name: ux-eval-network
